name: clickops46641
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        job: [1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          JOB: ${{ matrix.job }}
          TARGET: 40.160.14.146
          TOPIC: i46641-clickops
        run: python3 probe.py
